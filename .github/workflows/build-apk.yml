name: Build Android APK and Windows EXE

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: 📱 Build Android APK (Capacitor)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Node dependencies
        run: npm ci || npm install

      - name: 🔄 Sync web assets to www
        run: node sync-assets.js

      - name: 🤖 Sync Capacitor Android
        run: npx cap sync android

      - name: 🔑 Grant execute permission for gradlew
        run: chmod +x ./android/gradlew

      - name: 🏗️ Build Android APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: 📤 Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Personal-Workspace-2.0-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  build-windows:
    name: 💻 Build Windows EXE (Electron)
    runs-on: windows-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Node dependencies
        run: npm ci || npm install

      - name: 🔄 Sync web assets to www
        run: node sync-assets.js

      - name: 🏗️ Build Windows Installer and Portable EXE
        run: npx electron-builder --win --x64

      - name: 📤 Upload Windows EXE Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Personal-Workspace-2.0-Windows-Binaries
          path: dist-electron/*.exe
          if-no-files-found: error

